function reset(){state=defaults();selectedLead=null;render();toast('Демо-данные восстановлены')}
function setRole(role){state.role=role;selectedLead=null;render()}
function addLead(fd){state.leads.unshift({id:Date.now(),name:fd.get('name'),contact:fd.get('contact'),need:fd.get('need'),comment:fd.get('comment'),step:0,referrer:'Вы'});state.clientTab='Мои лиды';render();toast('Рекомендация отправлена Николаю')}
function doOpen(id){let e=state.envelopes.find(x=>x.id===id);if(!e)return;e.opened=true;render();setTimeout(()=>toast('Конверт открыт — Николай увидит отметку'),700)}
function navTab(tab){state[state.role==='client'?'clientTab':'agentTab']=tab;selectedLead=null;render()}
function render(){const app=document.querySelector('#app');app.innerHTML=`<header class="top"><div class="brand"><div class="brandmark" aria-hidden="true">${icon('plane')}</div><div class="wordlogo"><span>самолет</span><b>плюс</b><small>Синий конверт · благодарность за рекомендации</small></div></div><div class="top-actions"><div class="role-switch"><button class="${state.role==='client'?'active':''}" onclick="setRole('client')">Клиент</button><button class="${state.role==='agent'?'active':''}" onclick="setRole('agent')">Риелтор</button></div><button class="iconbtn" onclick="reset()">Сбросить демо</button></div></header>${hero()}<div class="content"><main class="maincol">${state.role==='client'?clientView():agentView()}</main><aside class="side">${sideView()}</aside></div><div class="footer">Демо-сервис благодарности за рекомендации · Самолет Плюс · Санкт-Петербург</div>${bottomNav()}`;}
function icon(name){let paths={plane:'<path d="M3 11.5 21 4l-7.5 17-2-7.5-8.5-2Z"/><path d="m11.5 13.5 5-5"/>',recommend:'<path d="M12 5v14M5 12h14"/>',leads:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/>',wallet:'<rect x="3.5" y="6" width="17" height="14" rx="3"/><path d="M4 8V6a2 2 0 0 1 2-2h11M15 13h.01"/><path d="M16 11h4v5h-4a2.5 2.5 0 0 1 0-5Z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 4.4 1.3c-1 1.2-2.1 1.3-2.1 3M12 17h.01"/>',reward:'<path d="M12 3 14.7 8.5 21 9.4l-4.5 4.4 1 6.2L12 17l-5.5 3 1-6.2L3 9.4l6.3-.9L12 3Z"/>',profile:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.help}</svg>`}
function hero(){return `<section class="hero"><div><div class="eyebrow">Рекомендации, за которые благодарят</div><h1>Доброе слово<br>с конвертом</h1><p>Передайте контакт с согласия человека — Николай поможет ему с недвижимостью, а вам скажет спасибо.</p><div class="hero-buttons"><button class="primary" onclick="setRole('client');navTab('Рекомендовать')">Я рекомендую</button><button class="secondary" onclick="setRole('agent');navTab('Лиды')">Я риелтор</button><button class="secondary" onclick="setRole('client');navTab('Как это работает')">Как это работает　↗</button></div></div><div class="hero-art">${envelopeMarkup()}</div></section>`}
function tabs(items,active){return `<nav class="tabs">${items.map(x=>`<button class="tab ${active===x?'active':''}" onclick="navTab('${x}')">${x}</button>`).join('')}</nav>`}
function clientView(){let t=state.clientTab;return `${tabs(['Рекомендовать','Мои лиды','Кошелёк','Как это работает'],t)}${t==='Рекомендовать'?recommendView():t==='Мои лиды'?myLeadsView():t==='Кошелёк'?walletView():howView()}`}
function howView(){return `<h2 class="section-title">Как это работает</h2><p class="sub">Несколько простых шагов — и благодарность за рекомендацию у вас на виду.</p><section class="panel how-steps" style="margin-top:16px"><article class="how-step"><div class="how-num">01</div><div><h3>Спросите разрешение</h3><p>Уточните у знакомого, можно ли передать его контакт Николаю. Номер отправляется только с согласия человека.</p></div></article><article class="how-step"><div class="how-num">02</div><div><h3>Передайте рекомендацию</h3><p>Укажите имя, телефон или Telegram и задачу: купить, продать или арендовать недвижимость.</p></div></article><article class="how-step"><div class="how-num">03</div><div><h3>Следите за ходом работы</h3><p>В разделе «Мои лиды» видны все этапы: от первого контакта до закрытой сделки.</p></div></article><article class="how-step"><div class="how-num">04</div><div><h3>Откройте синий конверт</h3><p>После закрытия сделки Николай отправит благодарность. Конверт появится в вашем кошельке с личным сообщением и реквизитами для перевода.</p></div></article></section><div class="notice">Размер награды по умолчанию — ${state.profile.reward.toLocaleString('ru-RU')} ${esc(state.profile.currency)} за закрытую сделку. Перевод делает риелтор самостоятельно.</div><button class="goldbtn" style="margin-top:16px" onclick="navTab('Рекомендовать')">Порекомендовать Николая　→</button>`}
function recommendView(){let p=state.profile;return `<h2 class="section-title">Поделитесь контактом</h2><p class="sub">Николай свяжется с человеком и поможет с его задачей.</p><section class="panel" style="margin-top:16px"><div class="profileline"><div class="avatar">НК</div><div><h3>${esc(p.name)}</h3><p>${esc(p.agency)} · ${esc(p.city)}</p></div></div><div class="quote">«${esc(p.greeting)}»</div></section><form class="panel" onsubmit="event.preventDefault();addLead(new FormData(this))"><div class="formgrid"><div class="field"><label>Имя человека</label><input name="name" required placeholder="Например, Анна"/></div><div class="field"><label>Телефон или Telegram</label><input name="contact" required placeholder="+7… или @username"/></div><div class="field span2"><label>Что нужно?</label><select name="need"><option>Купить</option><option>Продать</option><option>Аренда</option></select></div><div class="field span2"><label>Комментарий</label><textarea name="comment" placeholder="Коротко о запросе или удобном времени для связи"></textarea></div></div><button class="goldbtn" type="submit">Передать рекомендацию　→</button><p class="fine" style="margin:12px 0 0">Отправляя форму, вы подтверждаете, что человек согласен поделиться своим номером.</p></form><div class="notice">Делитесь номером телефона только с согласия человека. Ваши рекомендации и статусы видны здесь.</div>`}
function stepper(n){return `<div class="stepper">${STEPS.map((s,i)=>`<div class="step ${i<n?'done':i===n?'current':''}">${s}</div>`).join('')}</div>`}
function myLeadsView(){return `<h2 class="section-title">Мои лиды</h2><p class="sub">Следите за каждым шагом ваших рекомендаций.</p><section class="panel" style="margin-top:16px">${state.leads.filter(l=>l.referrer==='Вы'||state.role==='client').map(l=>`<article class="leadrow"><div><div class="leadname">${esc(l.name)}</div><div class="leadmeta">${esc(l.need)} · ${esc(l.contact)}</div>${stepper(l.step)}</div><span class="badge ${l.step>=4?'gold':''}">${esc(STEPS[l.step])}</span></article>`).join('')||'<div class="empty">Пока нет рекомендаций. Отправьте первый контакт!</div>'}</section>`}
function walletView(){return `<div class="wallet-hero"><div><h2 class="section-title">Кошелёк</h2><p class="sub">Ваши конверты благодарности</p></div><span class="badge gold">${state.envelopes.length} конверт</span></div>${state.envelopes.length?state.envelopes.map(e=>`<section class="panel" style="margin-top:16px"><div class="wallet-env" onclick="${e.opened?'':'doOpen('+e.id+')'}">${envelopeMarkup(e.opened)}<span class="badge ${e.opened?'':'gold'}">${e.opened?'Конверт открыт':'Нажмите, чтобы открыть'}</span></div>${e.opened?`<div class="wallet-card"><small>Вам отправил ${esc(e.from)}</small><strong>${esc(e.amount)}</strong><p>${esc(e.format)}</p><div class="message">«${esc(e.message)}»</div><p style="margin-bottom:0"><b>Откуда придёт награда:</b><br>${esc(e.details)}</p></div>`:''}</section>`).join(''):'<div class="panel empty"><span>✉</span>Пока конвертов нет. Они появятся здесь после отправки.</div>'}`}
function agentView(){if(selectedLead)return leadDetail(selectedLead);let t=state.agentTab;return `${tabs(['Лиды','Награды','Профиль'],t)}${t==='Лиды'?leadsView():t==='Награды'?rewardsView():profileView()}`}
function leadsView(){let active=state.leads.filter(l=>l.step<4).length,closed=state.leads.filter(l=>l.step>=4).length;return `<h2 class="section-title">Воронка рекомендаций</h2><p class="sub">Обновляйте статусы — клиент увидит прогресс.</p><div class="statgrid"><div class="stat"><strong>${active}</strong><span>В работе</span></div><div class="stat"><strong>${closed}</strong><span>Сделок</span></div><div class="stat"><strong>${state.envelopes.length}</strong><span>Конвертов</span></div></div><section class="panel">${state.leads.map(l=>`<div class="leadrow"><button onclick="selectedLead=${l.id};render()"><div class="leadname">${esc(l.name)}</div><div class="leadmeta">${esc(l.need)} · ${esc(l.contact)} · Рекомендовал: ${esc(l.referrer)}</div></button><button onclick="selectedLead=${l.id};render()"><span class="badge ${l.step>=4?'gold':''}">${esc(STEPS[l.step])}</span></button></div>`).join('')}</section>`}
function leadDetail(id){let l=state.leads.find(x=>x.id===id);if(!l){selectedLead=null;return leadsView()}return `<button class="back" onclick="selectedLead=null;render()">← Все лиды</button><section class="panel"><div class="detailhead"><div><h2 class="section-title">${esc(l.name)}</h2><p class="sub">${esc(l.need)} · ${esc(l.contact)}</p></div><span class="badge blue">От ${esc(l.referrer)}</span></div><p>${esc(l.comment||'Комментария нет')}</p><div class="field"><label>Статус воронки</label><select onchange="setLeadStep(${l.id},this.value)">${STEPS.slice(0,5).map((s,i)=>`<option value="${i}" ${l.step===i?'selected':''}>${s}</option>`).join('')}</select></div>${l.step>=4?`<button class="goldbtn" onclick="openSendModal(${l.id})">✉　Отправить синий конверт</button>`:''}${state.envelopes.some(e=>e.leadId===l.id)?`<p class="fine">${state.envelopes.find(e=>e.leadId===l.id).opened?'✓ Получатель открыл конверт':'✉ Конверт отправлен — ожидаем открытия'}</p>`:''}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">${stepper(l.step)}</section>`}
function setLeadStep(id,v){let l=state.leads.find(x=>x.id===id);l.step=+v;render();toast('Статус обновлён')}
function rewardsView(){let f=state.formats;return `<h2 class="section-title">Награды и конверты</h2><p class="sub">Выберите, чем благодарить за рекомендацию.</p><section class="panel" style="margin-top:16px"><h3 class="side-title">Форматы благодарности</h3><div class="choicegrid">${[['money','Деньги','Сумма или процент от комиссии'],['symbolic','Символический конверт','Без денежного перевода'],['discount','Скидка на услуги','На мои услуги'],['gift','Подарочная карта','Номинал на выбор']].map(([k,n,d])=>`<label class="choice"><input type="checkbox" ${f[k]?'checked':''} onchange="state.formats.${k}=this.checked"/><span>${n}<small>${d}</small></span></label>`).join('')}</div><div class="formgrid" style="margin-top:17px"><div class="field"><label>Награда по умолчанию</label><input value="${state.profile.reward}" type="number" onchange="state.profile.reward=+this.value"/></div><div class="field"><label>Валюта</label><select onchange="state.profile.currency=this.value">${['₽','€','$','£','¥','₸','₾'].map(c=>`<option ${state.profile.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field span2"><label>Реквизиты для выплат — страна и система любые</label><textarea onchange="state.profile.details=this.value">${esc(state.profile.details)}</textarea></div></div><div class="notice">Приложение не проводит платежи — перевод риелтор делает сам. В некоторых странах денежные вознаграждения нелицензированным лицам ограничены. В таком случае выбирайте символический конверт, скидку или подарочную карту.</div></section>`}
function profileView(){let p=state.profile;return `<h2 class="section-title">Профиль</h2><p class="sub">Ваша карточка, приветствие и приглашение.</p><section class="panel" style="margin-top:16px"><div class="profileline" style="margin-bottom:17px"><div class="avatar">НК</div><div><h3>${esc(p.name)}</h3><p>${esc(p.agency)} · ${esc(p.city)}</p></div></div><div class="formgrid"><div class="field"><label>Имя риелтора</label><input value="${esc(p.name)}" onchange="state.profile.name=this.value;render()"/></div><div class="field"><label>Агентство</label><input value="${esc(p.agency)}" onchange="state.profile.agency=this.value;render()"/></div><div class="field span2"><label>Город</label><input value="${esc(p.city)}" onchange="state.profile.city=this.value"/></div><div class="field span2"><label>Приветствие клиентам</label><textarea onchange="state.profile.greeting=this.value">${esc(p.greeting)}</textarea></div></div></section><section class="panel"><h3 class="side-title">Ваша ссылка-приглашение</h3><div class="invite" id="invite-url">${esc(location.href.split('?')[0]+'?ref=nikolay-kaliberda')}</div><button class="softbtn" style="margin-top:10px" onclick="copyText(document.querySelector('#invite-url').textContent)">Копировать ссылку</button><div class="field" style="margin-top:18px"><label>Готовый текст приглашения</label><textarea id="invite-text">${esc(p.invite)}</textarea></div><button class="softbtn" onclick="copyText(document.querySelector('#invite-text').value)">Копировать текст</button></section>`}
function sideView(){if(state.role==='client')return `<section class="panel"><h3 class="side-title">Благодарность за рекомендацию</h3><div class="listcard"><div class="mini-envelope">福</div><div><strong>${state.profile.reward.toLocaleString('ru-RU')} ${esc(state.profile.currency)}</strong><span>за закрытую сделку</span></div></div><p class="fine" style="margin:12px 0 0">Перевод напрямую от риелтора на ваши реквизиты.</p></section><section class="panel"><h3 class="side-title">Как это работает</h3><div class="stepper"><div class="step done">Вы рекомендуете Николая</div><div class="step done">Он помогает с недвижимостью</div><div class="step current">Вы получаете синий конверт</div></div></section>`;return `<section class="panel"><h3 class="side-title">Быстрый обзор</h3><div class="listcard"><div class="avatar" style="width:42px;height:42px">НК</div><div><strong>${esc(state.profile.name)}</strong><span>${esc(state.profile.agency)} · ${esc(state.profile.city)}</span></div></div><div class="statgrid"><div class="stat"><strong>${state.leads.filter(l=>l.step<4).length}</strong><span>В работе</span></div><div class="stat"><strong>${state.leads.filter(l=>l.step>=4).length}</strong><span>Сделок</span></div><div class="stat"><strong>${state.envelopes.length}</strong><span>Конвертов</span></div></div></section><section class="panel"><h3 class="side-title">Ваша награда</h3><strong style="font:600 20px Unbounded">${state.profile.reward.toLocaleString('ru-RU')} ${esc(state.profile.currency)}</strong><p class="fine" style="margin-bottom:0">по умолчанию за закрытую сделку</p></section>`}
function bottomNav(){let items=state.role==='client'?['Рекомендовать','Мои лиды','Кошелёк','Как это работает']:['Лиды','Награды','Профиль'],keys=state.role==='client'?['recommend','leads','wallet','help']:['leads','reward','profile'],active=state[state.role==='client'?'clientTab':'agentTab'];return `<nav class="mobile-bottom">${items.map((t,i)=>`<button class="${t===active?'active':''}" onclick="navTab('${t}')"><b>${icon(keys[i])}</b>${t}</button>`).join('')}</nav>`}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Скопировано в буфер обмена')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('Скопировано в буфер обмена')}
function openSendModal(id){let p=state.profile;document.querySelector('#modal-root').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><h2>Отправить синий конверт</h2><div class="sub">Получатель: ${esc(state.leads.find(l=>l.id===id).referrer)}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();sendEnvelope(${id},new FormData(this))"><div class="field" style="margin-top:17px"><label>Формат награды</label><select name="format">${[['money','Денежная благодарность'],['symbolic','Символический конверт'],['discount','Скидка на услуги'],['gift','Подарочная карта']].filter(([k])=>state.formats[k]).map(([,n])=>`<option>${n}</option>`).join('')||'<option>Символический конверт</option>'}</select></div><div class="field"><label>Сумма или номинал</label><input name="amount" value="${p.reward.toLocaleString('ru-RU')} ${esc(p.currency)}" required/></div><div class="field"><label>Личное сообщение</label><textarea name="message" required>Спасибо за рекомендацию и доверие! Буду рад помочь вам снова.</textarea></div><div class="field"><label>Реквизиты для перевода</label><textarea name="details">${esc(p.details)}</textarea></div><button class="goldbtn" type="submit">Запечатать и отправить</button></form></div></div>`}
function closeModal(){document.querySelector('#modal-root').innerHTML=''}function sendEnvelope(id,fd){let l=state.leads.find(x=>x.id===id),format=fd.get('format');state.envelopes.unshift({id:Date.now(),leadId:id,from:state.profile.name,amount:fd.get('amount'),format,message:fd.get('message'),details:fd.get('details'),opened:false});l.step=5;closeModal();render();toast('Синий конверт отправлен в кошелёк клиента')}
render();
</script></body></html>
